name: Publish Package

# Publishes to npm using Trusted Publishing (OIDC) — no NPM_TOKEN secret.
#
# One-time setup on npmjs.com (after the package exists):
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : sorcnr
#     Repository           : opencode-teamwork-v2
#     Workflow filename    : publish.yml
#     Allowed actions      : npm publish   (npm stage publish is always allowed)
#
# Release flow:
#   npm version patch        # or edit "version" in package.json
#   git push --follow-tags   # pushes the vX.Y.Z tag -> this workflow publishes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Prefer the latest npm but
      # fall back to the newest 11.x if the latest requires a newer Node.
      - name: Ensure recent npm
        run: |
          npm install -g npm@latest || npm install -g "npm@^11"
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if(v[0]<11||(v[0]===11&&v[1]<5)){console.error('npm too old for OIDC:',v.join('.'));process.exit(1)}"

      - name: Sanity check
        run: |
          node --check lib/team.mjs
          node --check lib/picker.mjs
          node --check bin/opencode-teamwork.mjs
          node --check postinstall.mjs
          npm pack --dry-run

      # `repository.url` in package.json must exactly match this GitHub repo or
      # provenance/OIDC verification fails. npm generates provenance
      # automatically under trusted publishing — no --provenance flag needed.
      - name: Publish
        run: npm publish --access public
