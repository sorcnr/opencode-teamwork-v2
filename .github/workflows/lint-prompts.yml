name: Lint prompts

on:
  push:
    paths:
      - "agents/**"
      - "plugins/**"
      - "docs/**"
      - "scripts/lint-prompts.mjs"
      - ".github/workflows/lint-prompts.yml"
  pull_request:
    paths:
      - "agents/**"
      - "plugins/**"
      - "docs/**"
      - "scripts/lint-prompts.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      # The linter uses only Node built-ins.
      - run: node scripts/lint-prompts.mjs
